{% extends 'base.html' %}
{% block content %}
<h1>Your Orders</h1>
{% if orders %}
    <ul>
        {% for order in orders %}
            <li>
                Order ID: {{ order.id }} - Product: {{ order.product.name }} - ₹{{ order.product.price }}
                <a href="{% url 'cancel_order' order.id %}" class="cancel-order-btn">Cancel Order</a>
            </li>
        {% endfor %}
    </ul>
{% else %}
    <p>You have no orders yet.</p>
{% endif %}
{% endblock %}
