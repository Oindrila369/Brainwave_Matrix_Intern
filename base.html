{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Store{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <div class="container">
            <h1>Welcome to My Store</h1>
            <div class="header-buttons">
                <a href="{% url 'wishlist' %}" class="header-btn">Wishlist</a>
                <a href="{% url 'view_cart' %}" class="header-btn">Cart</a>
                <a href="{% url 'my_orders' %}" class="header-btn">My Orders</a>
            </div>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2025 My Store</p>
    </footer>
</body>
</html>
